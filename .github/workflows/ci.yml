name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar padrão de código (PEP 8 / flake8)
        run: |
          pip install flake8
          flake8 src tests --max-line-length=100 --extend-ignore=E203

      - name: Executar testes automatizados
        run: python -m pytest tests/ -v --junitxml=relatorio-testes.xml

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ matrix.python-version }}
          path: relatorio-testes.xml

  build-docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t sdd-task-analyzer:ci .

      - name: Executar testes dentro do container
        run: docker run --rm sdd-task-analyzer:ci
