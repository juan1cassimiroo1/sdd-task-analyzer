name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar padrão de código (PEP 8 / flake8)
        run: |
          pip install flake8
          flake8 src tests --max-line-length=100 --extend-ignore=E203

      - name: Executar suíte de testes (Test Harness)
        run: pytest tests/test_harness.py -v

  docker:
    name: Containerização (Docker)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t sdd-task-analyzer:ci .

      - name: Executar testes dentro do container
        run: docker run --rm sdd-task-analyzer:ci

      - name: Executar via docker compose
        run: docker compose run --rm task-analyzer
